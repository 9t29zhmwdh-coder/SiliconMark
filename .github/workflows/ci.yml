name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check --select E9,F821-F823 --output-format=github .
      - name: Syntax check
        run: python -m compileall -q siliconmark/ || python -m compileall -q . -x "__pycache__"
