name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Format & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      # Every package comes from requirements/ci.txt with its hash checked;
      # SiliconMark itself is installed without resolving anything further.
      - name: Install pinned dependencies and tools
        run: |
          python -m pip install --require-hashes -r requirements/ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lock file matches pyproject.toml
        run: |
          cp requirements/ci.txt fresh.txt
          uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.11 --generate-hashes -q --custom-compile-command "uv pip compile pyproject.toml requirements/tools.in --extra dev --universal --python-version 3.11 --generate-hashes -o requirements/ci.txt" -o fresh.txt
          diff requirements/ci.txt fresh.txt
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest tests/ -v --cov=siliconmark --cov-report=term-missing
      - name: Security audit
        run: pip-audit --skip-editable
      - name: Build wheel and sdist
        run: python -m build --no-isolation
