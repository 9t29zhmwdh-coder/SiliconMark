name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Nur was ueber das workflow-weite contents: read hinausgeht.
      # Read-Rechte hier zu wiederholen ist das, was OpenSSF Scorecard
      # als zu weite Token-Berechtigung bemaengelt.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install build tool
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Legt das Release an, oder haengt die Dateien an ein bestehendes.
          #
          # Vorher brach der Schritt mit "a release with the same tag name already
          # exists" ab, sobald das Release schon auf anderem Weg entstanden war. Das
          # Ergebnis war ein Release ohne Downloads und ein roter Lauf, obwohl der
          # Build erfolgreich war.
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* --repo ${{ github.repository }} --title "SiliconMark ${{ github.ref_name }}" --notes "See CHANGELOG.md for details. Install with: pip install <wheel URL from this release>."
          fi
