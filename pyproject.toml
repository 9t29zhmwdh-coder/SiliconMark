[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "siliconmark"
version = "0.1.4"
description = "Apple Silicon LLM Benchmark Suite — Ollama, llama.cpp, MLC, GGUF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["benchmark", "apple-silicon", "llm", "ollama", "llama.cpp", "mlc"]

dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "httpx>=0.27",
    "psutil>=5.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
gguf = ["llama-cpp-python>=0.2"]
mlc  = ["mlc-llm>=0.1"]
dev  = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
siliconmark = "siliconmark.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["siliconmark"]

[tool.ruff]
line-length = 100
target-version = "py311"
